<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="#6e8f84" stroke-linecap="round">
    <!-- continuous lines close to the avatar -->
    <g stroke-width="1.4" opacity="0.34">
      <circle cx="800" cy="430" r="290" />
      <circle cx="800" cy="430" r="350" />
