    <!-- complete circular outer group with no directional gaps -->
    <g stroke-width="1.2" opacity="0.2">
      <circle cx="800" cy="430" r="560" />
      <circle cx="800" cy="430" r="700" />
      <circle cx="800" cy="430" r="840" />
    </g>
  </g>
</svg>
