<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="电话卡、U卡与薅羊毛的一图流教程。">
  <link rel="canonical" href="https://blog.wufeng.de/card/">
  <title>卡圈情报站</title>
  <style>
    :root {
      color: #3f5668;
      background: #eef3f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background-color: #eef3f7;
      background-image:
        linear-gradient(to right, rgba(63, 86, 104, .13) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(63, 86, 104, .13) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    main {
      width: min(100%, 860px);
      margin: 0 auto;
      padding: clamp(28px, 7vw, 72px);
      border: 1px solid rgba(63, 86, 104, .22);
      border-radius: 20px;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 18px 50px rgba(44, 67, 84, .12);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 44px;
    }

    .topbar a,
    .back-link {
      color: inherit;
      font-weight: 700;
      text-decoration: none;
    }

    .topbar a:hover,
    .topbar a:focus-visible,
    .back-link:hover,
    .back-link:focus-visible { text-decoration: underline; }

    .eyebrow {
      margin: 0 0 10px;
      color: #5d7890;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #2d4354;
      font-size: clamp(2.2rem, 7vw, 4.8rem);
      line-height: 1.05;
    }

    .intro {
      max-width: 38rem;
      margin: 20px 0 0;
      color: #536b7d;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      line-height: 1.8;
    }

    .topics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 42px 0;
    }

    .topic {
      padding: 20px;
      border: 1px solid rgba(63, 86, 104, .3);
      border-radius: 14px;
      background: rgba(238, 243, 247, .78);
    }

    .topic h2 {
      margin: 0 0 8px;
      color: #2d4354;
      font-size: 1.08rem;
    }

    .topic p {
      margin: 0;
      color: #63798a;
      line-height: 1.65;
    }

    .notice {
      margin: 0 0 30px;
      padding: 16px 18px;
      border-left: 4px solid #3f5668;
      background: rgba(63, 86, 104, .08);
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      body { padding: 12px; }
      main { padding: 28px 20px; border-radius: 14px; }
      .topbar { margin-bottom: 34px; }
      .topics { grid-template-columns: 1fr; margin: 30px 0; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="topbar" aria-label="页面导航">
      <a href="/">首页</a>
      <span>一图流教程</span>
    </nav>

    <p class="eyebrow">Card Circle Intelligence Station</p>
    <h1>卡圈情报站</h1>
    <p class="intro">电话卡、U卡与薅羊毛教程的整理站。用尽量简单的图解，快速说明办理、使用和避坑要点。</p>

    <section class="topics" aria-label="内容方向">
      <article class="topic">
        <h2>电话卡</h2>
        <p>不同国家和地区的电话卡、流量卡使用说明。</p>
      </article>
      <article class="topic">
        <h2>U卡</h2>
        <p>开通、充值、使用流程与常见问题解说。</p>
      </article>
      <article class="topic">
        <h2>薅羊毛</h2>
        <p>优惠活动、注册奖励和参与条件的图解整理。</p>
      </article>
      <article class="topic">
        <h2>避坑指南</h2>
        <p>把容易忽略的规则、限制和风险讲清楚。</p>
      </article>
    </section>

    <p class="notice">内容正在整理中，后续会持续补充一图流教程。</p>
    <a class="back-link" href="/">← 返回首页</a>
  </main>
</body>
</html>
