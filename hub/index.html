<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e9">
  <meta name="description" data-content-attr="content" data-content="meta.description" content="无风小卖部的全球 SIM 卡使用指南。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" data-content-attr="content" data-content="meta.title" content="无风小卖部｜全球 SIM 卡使用指南">
  <meta property="og:description" data-content-attr="content" data-content="meta.socialDescription" content="全球 SIM 卡使用指南。">
  <meta property="og:url" content="https://blog.wufeng.de/">
  <meta property="og:image" content="https://blog.wufeng.de/og-directory.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" data-content-attr="content" data-content="meta.title" content="无风小卖部｜全球 SIM 卡使用指南">
  <meta name="twitter:description" data-content-attr="content" data-content="meta.socialDescription" content="全球 SIM 卡使用指南。">
  <meta name="twitter:image" content="https://blog.wufeng.de/og-directory.png">
  <link rel="canonical" href="https://blog.wufeng.de/">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
  <title data-content="meta.title">无风小卖部｜全球 SIM 卡使用指南</title>
</head>
<body>
  <div class="line-field" aria-hidden="true">
    <span class="line line-one"></span>
    <span class="line line-two"></span>
    <span class="line line-three"></span>
    <span class="line-dot line-dot-one"></span>
    <span class="line-dot line-dot-two"></span>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-content-attr="aria-label" data-content="brand.homeLabel" aria-label="无风小卖部首页">
        <span class="brand-mark" aria-hidden="true">W</span>
        <strong data-content="brand.name">无风小卖部</strong>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#catalog" data-content="navigation.catalog">品牌目录</a>
        <a data-content-attr="href" data-content="footer.editUrl" href="https://github.com/ws126837251/ws126837251.github.io/edit/main/hub/site-content.json">
          <span data-content="footer.editLabel">GitHub</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow" data-content="brand.tagline">GLOBAL SIM GUIDES</p>
      <div class="avatar-stage">
        <span class="avatar-halo avatar-halo-one" aria-hidden="true"></span>
        <span class="avatar-halo avatar-halo-two" aria-hidden="true"></span>
        <a class="avatar-link" href="#catalog" data-content-attr="aria-label" data-content="brand.homeLabel" aria-label="无风小卖部首页">
          <span class="avatar-disc">
            <img src="/assets/wufeng-avatar.png" alt="" width="1254" height="1254">
          </span>
        </a>
      </div>
      <h1 id="hero-title" data-content="brand.name">无风小卖部</h1>
      <p class="hero-subtitle" data-content="footer.subtitle">全球 SIM 卡使用指南</p>
      <a class="hero-link" href="#catalog">
        <span data-content="navigation.catalog">品牌目录</span>
        <span aria-hidden="true">↘</span>
      </a>
    </section>

    <section class="directory" id="catalog" aria-labelledby="catalog-title">
      <div class="directory-heading">
        <div>
          <p class="eyebrow eyebrow-dark" data-content="catalog.eyebrow">DIRECTORY</p>
          <h2 id="catalog-title" data-content="catalog.title">选择你的电话卡</h2>
        </div>
        <p id="catalog-count" aria-live="polite">共 2 个品牌</p>
      </div>

      <div class="product-grid" id="product-grid">
        <!-- CATALOG_FALLBACK_START -->
      <a
        class="product-card product-card-static"
        href="/giffgaff/"
        aria-label="进入 Giffgaff 使用指南"
      >
        <span class="product-card-number">01</span>
        <span class="product-mark" aria-hidden="true">G</span>
        <span class="product-card-main">
          <span class="product-card-region">UK · 英国</span>
          <strong class="product-card-name">Giffgaff</strong>
          <span class="product-card-status">19 篇指南</span>
        </span>
        <span class="product-card-arrow" aria-hidden="true">↗</span>
      </a>
      <a
        class="product-card product-card-static"
        href="/lebara/"
        aria-label="进入 Lebara 使用指南"
      >
        <span class="product-card-number">02</span>
        <span class="product-mark" aria-hidden="true">L</span>
        <span class="product-card-main">
          <span class="product-card-region">UK · 英国</span>
          <strong class="product-card-name">Lebara</strong>
          <span class="product-card-status">16 篇指南</span>
        </span>
        <span class="product-card-arrow" aria-hidden="true">↗</span>
      </a>
        <!-- CATALOG_FALLBACK_END -->
      </div>

      <div class="empty-state" id="empty-state" hidden>
        <strong data-content="catalog.emptyTitle">没有可用的电话卡</strong>
        <p data-content="catalog.emptyDescription">新的品牌指南正在整理中。</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-inner">
      <span data-content="brand.name">无风小卖部</span>
      <span data-content="footer.copyright">© 2026 Wufeng</span>
    </div>
  </footer>
</body>
</html>
