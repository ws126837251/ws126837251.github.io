<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <g fill="none" stroke="#6e8f84" stroke-linecap="round">
    <!-- closed loops close to the avatar -->
    <g stroke-width="1.5" opacity="0.34">
      <ellipse cx="800" cy="450" rx="560" ry="190" transform="rotate(-13 800 450)" />
      <ellipse cx="810" cy="485" rx="430" ry="145" transform="rotate(18 810 485)" />
      <ellipse cx="795" cy="485" rx="260" ry="92" transform="rotate(-29 795 485)" />
    </g>

    <!-- wide closed loops keep all four directions populated -->
    <g stroke-width="1.2" opacity="0.22">
      <ellipse cx="800" cy="450" rx="940" ry="420" transform="rotate(-14 800 450)" />
      <ellipse cx="800" cy="470" rx="1040" ry="520" transform="rotate(18 800 470)" />
      <ellipse cx="800" cy="500" rx="1220" ry="680" transform="rotate(-31 800 500)" />
      <rect x="-85" y="-70" width="1770" height="1140" rx="360" ry="360" />
    </g>
  </g>
</svg>
