<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <g fill="none" stroke="#6e8f84" stroke-linecap="round">
    <!-- continuous lines close to the avatar -->
    <g stroke-width="1.4" opacity="0.34">
      <ellipse cx="800" cy="430" rx="310" ry="105" transform="rotate(-12 800 430)" />
      <ellipse cx="800" cy="430" rx="350" ry="120" transform="rotate(14 800 430)" />
